name: CI and offline image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GATEWAY_IMAGE: webrtc-gateway
  MEDIAMTX_IMAGE: bluenviron/mediamtx:1.20.1
  IMAGE_ARCHIVE: images-linux-amd64.tar.gz
  RELEASE_TAG: main-latest
  RELEASE_ARCHIVE: webrtc-gateway-offline-linux-amd64.tar
  RELEASE_CHECKSUM: webrtc-gateway-offline-linux-amd64.tar.sha256

jobs:
  build:
    name: Test and build offline bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test Go code
        run: go test -race ./...

      - name: Vet Go code
        run: go vet ./...

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Test web code
        run: npm --prefix web test

      - name: Check web types
        run: npm --prefix web run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:${{ github.sha }}
            ${{ env.GATEWAY_IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Pull MediaMTX image
        run: docker pull --platform linux/amd64 "${MEDIAMTX_IMAGE}"

      - name: Assemble offline bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline-bundle/deploy
          docker save \
            "${GATEWAY_IMAGE}:${GITHUB_SHA}" \
            "${GATEWAY_IMAGE}:main" \
            "${MEDIAMTX_IMAGE}" \
            | gzip --best > "offline-bundle/${IMAGE_ARCHIVE}"
          cp compose.yaml offline-bundle/compose.yaml
          cp deploy/mediamtx.yml offline-bundle/deploy/mediamtx.yml
          cp deploy/OFFLINE_DEPLOYMENT.md offline-bundle/README.md
          git rev-parse HEAD > offline-bundle/GATEWAY_COMMIT

      - name: Validate offline bundle
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f offline-bundle/compose.yaml config --quiet
          cd offline-bundle
          sha256sum \
            "${IMAGE_ARCHIVE}" \
            compose.yaml \
            deploy/mediamtx.yml \
            README.md \
            GATEWAY_COMMIT \
            > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-gateway-offline-linux-amd64-${{ github.sha }}
          path: offline-bundle/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish anonymous download
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download offline bundle
        uses: actions/download-artifact@v4
        with:
          name: webrtc-gateway-offline-linux-amd64-${{ github.sha }}
          path: offline-bundle

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          tar --create --file "${RELEASE_ARCHIVE}" --directory offline-bundle .
          sha256sum "${RELEASE_ARCHIVE}" > "${RELEASE_CHECKSUM}"

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "${main_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Skipping release because main has advanced to ${main_sha}."
            exit 0
          fi

          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              --raw-field sha="${GITHUB_SHA}" \
              --field force=true
            gh release edit "${RELEASE_TAG}" \
              --title "Latest main offline deployment" \
              --notes "Automated offline deployment bundle for main commit ${GITHUB_SHA}." \
              --prerelease
            gh release upload "${RELEASE_TAG}" \
              "${RELEASE_ARCHIVE}" \
              "${RELEASE_CHECKSUM}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "${RELEASE_ARCHIVE}" \
              "${RELEASE_CHECKSUM}" \
              --target "${GITHUB_SHA}" \
              --title "Latest main offline deployment" \
              --notes "Automated offline deployment bundle for main commit ${GITHUB_SHA}." \
              --prerelease
          fi
